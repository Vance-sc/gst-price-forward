# .authorship-check.conf - settings for tools/authorship-check.sh
#
# One entry per line: <key> <value>. Lines starting with # are comments.
# Keys:
#   allow_identity   "Name <email>" allowed as commit author and committer
#   allow_committer  "Name <email>" allowed as committer only, and only when
#                    the author is an allow_identity (GitHub web edits)
#   block_branch     branch name prefix that is not allowed (case-insensitive)
#   allow_path       path glob skipped by the content scan
#                    (* = within one folder, ** = any depth, ? = one char;
#                    a glob without "/" matches the file name in any folder)
#   allow_line       lowercase ERE; matching text is removed from a line
#                    before the blocked patterns are checked, so the line
#                    passes only if nothing blocked is left over
#   allow_line_in    <path glob> <lowercase ERE>: same, for matching paths only
#
# Per-repo tuning: add allow_path / allow_line entries at the bottom.

# --- identity ----------------------------------------------------------
allow_identity Vance Boucher <vance@socalbusinessgroup.com>
# Optional, off by default: GitHub's private no-reply address.
# allow_identity Vance Boucher <237500557+Vance-sc@users.noreply.github.com>

allow_committer GitHub <noreply@github.com>

# --- branch names --------------------------------------------------------
block_branch claude/
block_branch ai-
block_branch ccr-
block_branch cursor/
block_branch codex/
block_branch copilot/

# --- allowlist: this check's own files -------------------------------------
allow_path .authorship-check.conf
allow_path tools/authorship-check.sh
allow_path tools/authorship-check.patterns
allow_path tools/install-hooks.sh
allow_path tools/pre-commit-hooks.yaml.snippet
allow_path docs/AUTHORSHIP-CHECK.md
allow_path .github/workflows/authorship-check.yml
allow_path .githooks/*

# --- allowlist: tool config files the tools read ---------------------------
# (literal names below are patterns, not credit)
allow_path CLAUDE.md
allow_path .claude/**
allow_path **/.claude/**
allow_path .cursor/**
allow_path AGENTS.md
allow_line claude\.md
allow_line \.claude/

# --- allowlist: genuine code use -------------------------------------------
# Entries are applied in order, so longer forms come first.
# JS / TS imports and requires
allow_line ^[ \t]*import[ \t].*from[ \t]+["'](@anthropic-ai/[a-z0-9_.-]+|@openai/[a-z0-9_.-]+|openai|anthropic)["'];?
allow_line ^[ \t]*import[ \t]+["'](@anthropic-ai/[a-z0-9_.-]+|@openai/[a-z0-9_.-]+|openai|anthropic)["'];?
allow_line ^[ \t]*(const|let|var)[ \t]+[a-z0-9_${}, ]+=[ \t]*require\([ \t]*["'](@anthropic-ai/[a-z0-9_.-]+|@openai/[a-z0-9_.-]+|openai|anthropic)["'][ \t]*\);?
allow_line require\([ \t]*["'](@anthropic-ai/[a-z0-9_.-]+|@openai/[a-z0-9_.-]+|openai|anthropic)["'][ \t]*\)
# Python imports
allow_line ^[ \t]*from[ \t]+(anthropic|openai)[a-z0-9_.]*[ \t]+import[ \t]+[a-z0-9_, ()]*
allow_line ^[ \t]*import[ \t]+(anthropic|openai)[a-z0-9_.]*([ \t]+as[ \t]+[a-z0-9_]+)?
# SDK client calls, e.g. anthropic.Anthropic(...), openai.chat.completions.create(...)
allow_line (anthropic|openai)(\.[a-z_][a-z0-9_]*)*\(
# Package names in dependency manifests
allow_line_in package.json "(@anthropic-ai/[a-z0-9_.-]+|@openai/[a-z0-9_.-]+|openai|anthropic)"[ \t]*:
allow_line_in requirements*.txt ^[ \t]*(anthropic|openai)([ \t]*[<>=!~;[][^#]*)?
allow_line_in pyproject.toml ["'](anthropic|openai)([ \t]*[<>=!~^][^"']*)?["']
allow_line_in pyproject.toml ^[ \t]*(anthropic|openai)[ \t]*=
allow_path package-lock.json
allow_path poetry.lock
allow_path yarn.lock
allow_path pnpm-lock.yaml
allow_path uv.lock
# *_MODEL settings, e.g. SUMMARY_MODEL=model-id
allow_line [a-z0-9_]*_model[ \t]*[=:][ \t]*["']?[a-z0-9._:/-]*["']?
# Environment variable names, e.g. ANTHROPIC_API_KEY
allow_line [a-z0-9_]*(anthropic|openai|claude|gemini)_[a-z0-9_]*
# Quoted model ids, e.g. "claude-opus-5", 'gpt-4o', "gemini-2.5-pro"
allow_line ["'](claude|gpt|gemini|chatgpt)-[a-z0-9._-]+["']
# API hostnames
allow_line api\.anthropic\.com
allow_line api\.openai\.com

# --- per-repo entries --------------------------------------------------------
